name: Release Please

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**/docs/**"
      - "test/**"
      - "tests/**"
      - "**/test/**"
      - "**/tests/**"
      - "**/*.test.*"
      - "**/*.spec.*"
      - ".github/**"
      - "release-please-config.json"
  # release-please only ever runs on a push to main, so a release PR that goes
  # stale, or a run that failed, has no way back without a new commit. This
  # gives it one.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the four platform tarballs and the merged SHA256SUMS and keep them as workflow artifacts. No release is created, gated, changed or published.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  packages: read # pulls the dependency images quality.yml publishes

# One run per branch. A second push cancels the first, because whoever pushed
# again has already answered the question the running job was asked. The runs
# long enough to be overtaken are the expensive ones, so this is worth more
# than the share of runs it cancels suggests.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Draft release and gate
    # A dry run builds assets only: it must not create, gate or roll back a release.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    # The job runs only the release lane: the commit it releases already
    # passed every lane on its pull request, and the full profile here, run
    # serially in one container, took 25 to 37 minutes for each of 0.44.3 to
    # 0.44.5 to repeat them. 60 minutes leaves the lane and an uncached image
    # build room either way.
    timeout-minutes: 60
    steps:
      # On merge of a Release PR, creates a DRAFT GitHub Release and sets
      # release_created=true. A draft has no tag yet, so a failing gate below
      # leaves nothing published. The draft is published by the `assets` job,
      # once the platform tarballs are attached to it, and the next Release PR
      # is opened by the last job: in the same call as this one it would run
      # before this draft is tagged, miss the previous release, and write a
      # changelog over the whole history.
      - name: Run release-please (releases)
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          skip-github-pull-request: true
          # A Release PR opened with the built-in GITHUB_TOKEN arrives with no checks
          # on it, because GitHub does not start workflows for that token, and main
          # requires those checks. RELEASE_PLEASE_TOKEN raises the event as a real
          # account so the Release PR gets its own CI. Without the secret this still
          # works, but the Release PR then has to be closed and reopened once.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # Everything below runs ONLY on the merge that cut a release. Because the
      # release is made with GITHUB_TOKEN, no separate tag-triggered workflow
      # would fire, so gate and publish live here instead.
      #
      # Credentials are NOT persisted. actions/checkout writes GITHUB_TOKEN into
      # .git/config by default, and this job's token carries `contents: write`
      # and `pull-requests: write`. The quality container is handed this
      # checkout so the gate lane can read history, and a read-only mount stops
      # nothing here: reading the credential is the whole risk, and everything
      # the profile runs, tests and their dependencies included, could read it.
      # Nothing after this step uses git credentials -- release-please took its
      # own token above, and the gh calls below take theirs from env -- so
      # persisting them buys nothing.
      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      # The push to main that cut this release publishes the dependency images
      # under the same key (tools/quality-deps-key leaves out the version
      # lines a release changes), so the gate reuses them and adds only this
      # commit's source, as every lane does. When they are not there yet (that
      # run's image job is still going, or failed) the gate builds both from
      # nothing, as it always did.
      - name: Key the dependency images
        if: ${{ steps.release.outputs.release_created }}
        id: key
        run: tools/dependency-image-key | tee -a "$GITHUB_OUTPUT"
      # Logged in here rather than by the quality-image action: the check below
      # reads the registry before that action runs.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: ${{ steps.release.outputs.release_created }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for the dependency images
        if: ${{ steps.release.outputs.release_created }}
        id: published
        env:
          QUALITY_DEPS: ${{ steps.key.outputs.quality }}
          RUNTIME_DEPS: ${{ steps.key.outputs.runtime }}
        run: |
          if docker buildx imagetools inspect "$QUALITY_DEPS" >/dev/null 2>&1 \
            && docker buildx imagetools inspect "$RUNTIME_DEPS" >/dev/null 2>&1; then
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            echo 'a dependency image is not published yet; building both'
          fi
      - uses: ./.github/actions/quality-image
        if: ${{ steps.release.outputs.release_created && steps.published.outputs.reuse == 'true' }}
        with:
          quality-deps: ${{ steps.key.outputs.quality }}
          runtime-deps: ${{ steps.key.outputs.runtime }}
          runtime: "true"
          registry: "true"
      - name: Build pinned quality image
        if: ${{ steps.release.outputs.release_created && steps.published.outputs.reuse != 'true' }}
        run: docker build --target quality -t knossos:quality .

      # What only a release needs, run against the release commit before the
      # release is published: the dependency audits (an advisory may have been
      # published since the pull request's run), the external link check, the
      # MCP inspector, the runtime image and its checks, the install, upgrade
      # and rollback lifecycle, supply-chain assurance and the benchmark. Lint,
      # static analysis, tests, coverage and the gate passed on the pull request
      # that made this commit, so they are not run again here.
      - name: Run the release lane
        if: ${{ steps.release.outputs.release_created }}
        run: |
          docker run --name knossos-quality -e KNOSSOS_QUALITY_CONTAINER=1 \
            -e KNOSSOS_RUNTIME_IMAGE_GIVEN=1 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/workspace:ro" \
            knossos:quality full release

      - name: Verify the released runtime image reports its version
        if: ${{ steps.release.outputs.release_created }}
        run: |
          # The release lane left knossos:quality-runtime behind, built from
          # this commit either way; that is the image being released.
          docker tag knossos:quality-runtime knossos:release
          docker run --rm knossos:release version --json
          docker run --rm knossos:release doctor --json

      # A failed or cancelled gate (the job timeout included) removes the
      # draft and puts the merged Release PR back to `autorelease: pending`,
      # so nothing is ever tagged that did not pass and a later run can still
      # release this version. tools/ci/release-rollback holds the rule and
      # says why; tests/shell/release-rollback.sh plants each outcome.
      #
      # The step runs whatever happened before it, and hands the job's status
      # so far to the script, which acts on anything but `success`. The script
      # comes from the release commit's checkout. When the release was created
      # but the checkout itself failed, there is no script to run, so the
      # draft is deleted inline: the one case that cannot leave a draft behind
      # by depending on the step that failed.
      - name: Remove the draft release and re-open it when its gate did not pass
        if: ${{ always() && steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          CREATED: ${{ steps.release.outputs.release_created }}
          GATE: ${{ job.status }}
          TAG: ${{ steps.release.outputs.tag_name }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          if [ ! -x tools/ci/release-rollback ]; then
            echo '::error::The release commit was not checked out; deleting the draft. Relabel the Release PR to autorelease: pending by hand.'
            gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY"
            exit 1
          fi
          tools/ci/release-rollback --release-created "$CREATED" --gate-result "$GATE" \
            --repo "$GITHUB_REPOSITORY" --tag "$TAG" --sha "$SHA"

  # One tarball per platform, built natively on a runner of that platform at
  # the release commit. A dry run builds from the commit the workflow was
  # started on. All four must succeed: install.sh refuses a release that has no
  # build for the host, so a release without one platform is a broken release.
  #
  # Everything the build needs comes from the runner image or from a pinned
  # action: PHP 8.3 or newer, composer, Python 3, rustup and cargo are on the
  # hosted images, Node 24 comes from setup-node, and a macOS runner that lacks
  # a new enough PHP or composer gets it from Homebrew.
  tarballs:
    name: Tarball ${{ matrix.platform }}
    needs: release-please
    if: ${{ !cancelled() && (inputs.dry_run || (needs.release-please.result == 'success' && needs.release-please.outputs.release_created)) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      # A release stops at the first platform that fails. A dry run lets every
      # platform finish, since it exists to show what each one does.
      fail-fast: ${{ !inputs.dry_run }}
      # Each runner label must be an image GitHub currently offers: a retired
      # label never gets a runner, and then every release ends in a rollback.
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: macos-15, platform: darwin-arm64 }
          - { runner: macos-15-intel, platform: darwin-x86_64 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.dry_run && github.sha || needs.release-please.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Check the toolchain
        run: |
          if ! php -r 'exit(PHP_VERSION_ID >= 80300 ? 0 : 1);' >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = macOS ]; then
              brew install php
            else
              echo '::error::PHP 8.3 or newer is not on this runner image'
              exit 1
            fi
          fi
          if ! command -v composer >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = macOS ]; then
              brew install composer
            else
              echo '::error::composer is not on this runner image'
              exit 1
            fi
          fi
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          php --version
          composer --version
          node --version
          python3 --version
          cargo --version

      - name: Build the tarball
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          sh tools/release-tarball --out dist
          set -- dist/knossos-*-"$PLATFORM".tar.gz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::expected exactly one tarball for $PLATFORM in dist/"
            exit 1
          fi
          # The checksum line travels beside the tarball; the assets job merges the four.
          mv dist/SHA256SUMS "dist/$PLATFORM.sha256"
          ls -l dist

      # Each tarball is started on its own runner before anything is published,
      # so a broken macOS build fails here rather than at a user's doctor step.
      # In a real release it must also hold the version of the tag it is
      # attached to: the installer downloads knossos-<tag without v>-*.
      - name: Start the tarball and check its version
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          smoke=$(mktemp -d)
          set -- dist/knossos-*-"$PLATFORM".tar.gz
          tar -xzf "$1" -C "$smoke"
          set -- "$smoke"/knossos-*
          if [ "$#" -ne 1 ] || [ ! -d "$1" ]; then
            echo "::error::expected one top directory in the $PLATFORM tarball"
            exit 1
          fi
          tree=$1
          inside=$(cat "$tree/VERSION")
          if [ "$DRY_RUN" != true ] && [ "$inside" != "${TAG#v}" ]; then
            echo "::error::the $PLATFORM tarball holds version $inside, but the release tag is $TAG"
            exit 1
          fi
          mkdir "$smoke/data"
          said=$(KNOSSOS_DATA_DIR="$smoke/data" KNOSSOS_ROOTS_FILE="$smoke/data/roots.json" "$tree/bin/knossos" version)
          if [ "$said" != "Knossos $inside" ]; then
            echo "::error::bin/knossos version said '$said', VERSION says $inside"
            exit 1
          fi
          KNOSSOS_DATA_DIR="$smoke/data" KNOSSOS_ROOTS_FILE="$smoke/data/roots.json" "$tree/bin/knossos" doctor --json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # Merges the four checksum lines into one SHA256SUMS, and either keeps the
  # result as a workflow artifact (a dry run) or attaches it, the tarballs and
  # install.sh to the draft release and publishes it. The draft is published
  # only when the gate in the first job passed and every asset is attached. Any
  # other outcome, a failed or cancelled tarball build or upload included,
  # ends in the same rollback the gate has: the draft is deleted and the
  # Release PR goes back to pending. `always()` keeps this job running when the
  # run is cancelled, which is when a draft is most likely to be left behind.
  assets:
    name: Attach the assets and publish
    needs: [release-please, tarballs]
    if: ${{ always() && (inputs.dry_run || (needs.release-please.result == 'success' && needs.release-please.outputs.release_created)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # always(): the rollback at the end needs tools/ci/release-rollback on
      # disk, also in a failed or cancelled run, where the implicit success()
      # of a step would skip this checkout.
      - name: Checkout
        if: ${{ always() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.dry_run && github.sha || needs.release-please.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.tarballs.result == 'success' }}
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist

      - name: Merge the checksums and add the installer
        if: ${{ needs.tarballs.result == 'success' }}
        run: |
          cd dist || exit 1
          for platform in linux-x86_64 linux-arm64 darwin-arm64 darwin-x86_64; do
            set -- knossos-*-"$platform".tar.gz
            if [ "$#" -ne 1 ] || [ ! -f "$1" ] || [ ! -f "$platform.sha256" ]; then
              echo "::error::the build for $platform is missing"
              exit 1
            fi
          done
          cat ./*.sha256 | sort -k 2 > SHA256SUMS
          rm ./*.sha256
          sha256sum --check SHA256SUMS
          cp ../install.sh install.sh
          ls -l

      - name: Keep the assets as a workflow artifact (dry run)
        if: ${{ inputs.dry_run && needs.tarballs.result == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Attach the assets to the draft release
        if: ${{ !inputs.dry_run && needs.tarballs.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"

      - name: Publish the release now that its gate passed and its assets are attached
        if: ${{ !inputs.dry_run && needs.tarballs.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

      # The same rule as the gate's rollback: anything but `success` removes
      # the draft and re-opens the Release PR. The gate result handed over
      # folds in the first job and the tarball builds, because a step cannot
      # see a job that did not run its way. With the checkout failed there is
      # no script, so the draft is deleted inline.
      - name: Remove the draft release and re-open it when its assets or gate failed
        if: ${{ always() && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          CREATED: ${{ needs.release-please.outputs.release_created }}
          GATE: ${{ (job.status == 'success' && needs.tarballs.result == 'success' && needs.release-please.result == 'success') && 'success' || 'failure' }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          if [ ! -x tools/ci/release-rollback ]; then
            echo '::error::The release commit was not checked out; deleting the draft. Relabel the Release PR to autorelease: pending by hand.'
            gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY"
            exit 1
          fi
          tools/ci/release-rollback --release-created "$CREATED" --gate-result "$GATE" \
            --repo "$GITHUB_REPOSITORY" --tag "$TAG" --sha "$SHA"

  # Opens or updates the next Release PR. It runs after the release is
  # settled: after a publish the new tag exists to diff against, and after a
  # rollback the step above has made the merged PR pending again, so this
  # pass leaves it alone and the next run releases it.
  release-pr:
    name: Release PR
    needs: [release-please, tarballs, assets]
    if: ${{ !cancelled() && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run release-please (pull requests)
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          skip-github-release: true
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # The documentation site for the release just published, built from the
  # released commit and deployed with GitHub Pages' artifact deployment. These
  # two jobs come after `assets`, which publishes, so a release that was rolled
  # back never reaches them, and nothing in the rollback or in `release-pr`
  # reads them: no `always()`, no `needs.docs-*`. `continue-on-error` keeps a
  # failed build or deploy from failing the run of a release that is already
  # out; the site is then rebuilt by hand with the Documentation site workflow.
  docs-site:
    name: Build the documentation site
    needs: [release-please, assets]
    if: ${{ !inputs.dry_run && needs.release-please.outputs.release_created == 'true' && needs.assets.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/docs-site
        with:
          docs-ref: ${{ needs.release-please.outputs.tag_name }}
          upload: "true"

  docs-deploy:
    name: Deploy the documentation site
    needs: [docs-site]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
