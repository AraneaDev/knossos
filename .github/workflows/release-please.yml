name: Release Please

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**/docs/**"
      - "test/**"
      - "tests/**"
      - "**/test/**"
      - "**/tests/**"
      - "**/*.test.*"
      - "**/*.spec.*"
      - ".github/**"
      - "release-please-config.json"
  # release-please only ever runs on a push to main, so a release PR that goes
  # stale, or a run that failed, has no way back without a new commit. This
  # gives it one.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: read # pulls the dependency images quality.yml publishes

# One run per branch. A second push cancels the first, because whoever pushed
# again has already answered the question the running job was asked. The runs
# long enough to be overtaken are the expensive ones, so this is worth more
# than the share of runs it cancels suggests.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR + tag/release on merge
    runs-on: ubuntu-latest
    # The job runs the full quality profile (mutation testing runs only from
    # mutation.yml). It took 22 minutes for 0.20.0 and passed 30 for 0.20.1, so
    # the old limit cancelled a release whose gate was still passing and
    # deleted its draft.
    timeout-minutes: 60
    steps:
      # On merge of a Release PR, creates a DRAFT GitHub Release and sets
      # release_created=true. A draft has no tag yet, so a failing gate below
      # leaves nothing published. Opening the next Release PR is a separate
      # call at the end of the job: in the same call it would run before this
      # draft is tagged, miss the previous release, and write a changelog over
      # the whole history.
      - name: Run release-please (releases)
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          skip-github-pull-request: true
          # A Release PR opened with the built-in GITHUB_TOKEN arrives with no checks
          # on it, because GitHub does not start workflows for that token, and main
          # requires those checks. RELEASE_PLEASE_TOKEN raises the event as a real
          # account so the Release PR gets its own CI. Without the secret this still
          # works, but the Release PR then has to be closed and reopened once.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # Everything below runs ONLY on the merge that cut a release. Because the
      # release is made with GITHUB_TOKEN, no separate tag-triggered workflow
      # would fire, so gate and publish live here instead.
      # Full history: the profile's `gate` lane measures the released tree
      # against the commit before it, and a shallow clone cannot reach one.
      #
      # Credentials are NOT persisted. actions/checkout writes GITHUB_TOKEN into
      # .git/config by default, and this job's token carries `contents: write`
      # and `pull-requests: write`. The quality container is handed this
      # checkout so the gate lane can read history, and a read-only mount stops
      # nothing here: reading the credential is the whole risk, and everything
      # the profile runs, tests and their dependencies included, could read it.
      # Nothing after this step uses git credentials -- release-please took its
      # own token above, and the gh calls below take theirs from env -- so
      # persisting them buys nothing.
      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The push to main that cut this release publishes the dependency images
      # under the same key (tools/quality-deps-key leaves out the version
      # lines a release changes), so the gate reuses them and adds only this
      # commit's source, as every lane does. When they are not there yet (that
      # run's image job is still going, or failed) the gate builds both from
      # nothing, as it always did.
      - name: Key the dependency images
        if: ${{ steps.release.outputs.release_created }}
        id: key
        run: tools/dependency-image-key | tee -a "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ steps.release.outputs.release_created }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for the dependency images
        if: ${{ steps.release.outputs.release_created }}
        id: published
        env:
          QUALITY_DEPS: ${{ steps.key.outputs.quality }}
          RUNTIME_DEPS: ${{ steps.key.outputs.runtime }}
        run: |
          if docker buildx imagetools inspect "$QUALITY_DEPS" >/dev/null 2>&1 \
            && docker buildx imagetools inspect "$RUNTIME_DEPS" >/dev/null 2>&1; then
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            echo 'a dependency image is not published yet; building both'
          fi
      - uses: ./.github/actions/quality-image
        if: ${{ steps.release.outputs.release_created && steps.published.outputs.reuse == 'true' }}
        with:
          quality-deps: ${{ steps.key.outputs.quality }}
          runtime-deps: ${{ steps.key.outputs.runtime }}
          runtime: "true"
          registry: "true"
      - name: Build pinned quality image
        if: ${{ steps.release.outputs.release_created && steps.published.outputs.reuse != 'true' }}
        run: docker build --target quality -t knossos:quality .

      # The same versioned profile that gates every PR, run against the release
      # commit before the release is published: lint, static analysis, tests,
      # coverage floors, security audits, and supply-chain assurance. The lanes
      # run one after another in this container, so PHPUnit runs once, under
      # pcov in the coverage lane, as it does in the PR checks; the tests lane
      # then runs the shell tests only.
      - name: Run full quality profile
        if: ${{ steps.release.outputs.release_created }}
        run: |
          docker run --name knossos-quality -e KNOSSOS_QUALITY_CONTAINER=1 \
            -e KNOSSOS_PHPUNIT_IN_COVERAGE=1 \
            -e KNOSSOS_RUNTIME_IMAGE_GIVEN=1 \
            -e KNOSSOS_GATE_REPO=/workspace \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/workspace:ro" \
            knossos:quality full

      - name: Verify the released runtime image reports its version
        if: ${{ steps.release.outputs.release_created }}
        run: |
          # The release lane left knossos:quality-runtime behind, built from
          # this commit either way; that is the image being released.
          docker tag knossos:quality-runtime knossos:release
          docker run --rm knossos:release version --json
          docker run --rm knossos:release doctor --json

      - name: Publish the release now that its gate passed
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

      # A failed or cancelled gate (the job timeout included) removes the
      # draft and puts the merged Release PR back to `autorelease: pending`,
      # so nothing is ever tagged that did not pass and a later run can still
      # release this version. tools/ci/release-rollback holds the rule and
      # says why; tests/shell/release-rollback.sh plants each outcome.
      #
      # The step runs whatever happened before it, and hands the job's status
      # so far to the script, which acts on anything but `success`. The script
      # comes from the release commit's checkout. When the release was created
      # but the checkout itself failed, there is no script to run, so the
      # draft is deleted inline: the one case that cannot leave a draft behind
      # by depending on the step that failed.
      - name: Remove the draft release and re-open it when its gate did not pass
        if: ${{ always() && steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          CREATED: ${{ steps.release.outputs.release_created }}
          GATE: ${{ job.status }}
          TAG: ${{ steps.release.outputs.tag_name }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          if [ ! -x tools/ci/release-rollback ]; then
            echo '::error::The release commit was not checked out; deleting the draft. Relabel the Release PR to autorelease: pending by hand.'
            gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY"
            exit 1
          fi
          tools/ci/release-rollback --release-created "$CREATED" --gate-result "$GATE" \
            --repo "$GITHUB_REPOSITORY" --tag "$TAG" --sha "$SHA"

      # Opens or updates the next Release PR. It runs after the release is
      # settled: after a publish the new tag exists to diff against, and after
      # a rollback the step above has made the merged PR pending again, so this
      # pass leaves it alone and the next run releases it.
      - name: Run release-please (pull requests)
        if: ${{ !cancelled() }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          skip-github-release: true
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
