name: PR Title

# pull_request_target, not pull_request: the workflow definition and the script
# it runs are taken from the base branch, so a pull request cannot weaken or
# delete this check in the same change it is meant to police. That trigger runs
# in a trusted context, so this job MUST stay base-only -- it checks out the
# base commit, never the pull request's own tree, and runs nothing from it.
#
# The consequence to know: the version that runs is the one on main, so an edit
# to the check itself is only exercised after it merges.
#
# `labeled` and `unlabeled` are there for release-please, which labels its pull
# request just after opening it: the run for `opened` can miss the label and
# refuse the release subject, and the label arriving runs the check again.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # reads the labels, files and diff tools/ci/release-pr judges
    steps:
      # The base BRANCH at full depth, not the pull request's pinned base
      # commit: a pull request opened before this check existed pins a base
      # commit that predates the script, and the job then fails on a missing
      # file rather than on the title. The branch tip is equally trusted and is
      # the rule as it stands now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false

      # Whether this is release-please's own pull request, the only one whose
      # title and commits may carry the release subject. Decided by its content
      # with the base branch's tools/ci/release-pr, as quality.yml decides it;
      # the pull request is read as data through the API and nothing of it
      # runs. A pull request that cannot be read is an ordinary one.
      - name: Decide whether this is release-please's pull request
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          dir=$(mktemp -d)
          if ! { gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' > "$dir/labels" &&
            gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path' > "$dir/files" &&
            gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" > "$dir/diff"; }; then
            echo '::notice::Could not read the pull request; treating it as an ordinary one.'
            exit 0
          fi
          status=0
          tools/ci/release-pr --repo "$GITHUB_REPOSITORY" --head-repo "$HEAD_REPO" \
            --labels "$dir/labels" --files "$dir/files" --diff "$dir/diff" || status=$?
          case "$status" in
            0) echo 'flag=--release-pr' >> "$GITHUB_OUTPUT" ;;
            1) ;;
            *) exit "$status" ;;
          esac

      # A squash merge of a multi-commit branch takes the PR title as the commit
      # subject, so the title -- not the branch's own commits -- is what
      # release-please parses on main. --ci leaves nothing exempt that a person
      # could type; the release subject passes only with --release-pr.
      #
      # The title is passed through the environment rather than interpolated
      # into the script: it is attacker-controlled text, and under
      # pull_request_target this is a trusted runner. The `--` keeps a title
      # that starts with a dash from being read as a flag.
      - name: Check the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          RELEASE_PR: ${{ steps.release.outputs.flag }}
        run: bash tools/check-commit-style.sh --ci ${RELEASE_PR:+"$RELEASE_PR"} -- "$PR_TITLE"

      # A branch that is rebased onto main instead of squashed puts its own
      # subjects on main, so those are checked too, fixup! and squash! ones
      # included. A real merge commit (two parents, such as the one GitHub's
      # update-branch button makes) is left out: a rebase merge drops it and a
      # squash merge folds it in, so it never reaches main. A one-parent commit
      # whose subject merely starts with "Merge" is checked like any other.
      # The pull request's commits are fetched as data and never executed.
      - name: Check every commit on the branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_PR: ${{ steps.release.outputs.flag }}
        run: |
          git fetch --quiet origin "refs/pull/$PR_NUMBER/head"
          # Where the branch actually left this one, rather than the pull
          # request's pinned base commit, which goes stale as main moves on.
          base=$(git merge-base HEAD FETCH_HEAD)
          status=0
          while IFS= read -r subject; do
            [ -n "$subject" ] || continue
            bash tools/check-commit-style.sh --ci ${RELEASE_PR:+"$RELEASE_PR"} -- "$subject" || status=1
          done < <(git log --no-merges --format='%s' "$base..FETCH_HEAD")
          exit "$status"
