default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit, pre-push]
minimum_pre_commit_version: "4.6.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        # Work belongs on a topic branch so it can be reviewed as a pull
        # request. `git commit --no-verify` remains the deliberate exception.
        args: [--branch, main, --branch, master]
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=no]
      - id: trailing-whitespace
        # A unified diff marks an empty context line with a single space, so
        # stripping it would leave a recorded diff that no longer parses.
        exclude: ^tests/shell/fixtures/
  - repo: local
    hooks:
      - id: knossos-fast-quality
        name: Knossos fast quality
        entry: tools/quality fast
        language: system
        pass_filenames: false
      - id: knossos-full-quality
        name: Knossos full quality
        entry: tools/quality full
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: commit-style
        name: Conventional commit subject
        entry: tools/check-commit-style.sh --file
        language: system
        stages: [commit-msg]
